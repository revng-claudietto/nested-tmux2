[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nested-tmux"
version = "0.1.0"
description = "Declarative terminal trees with nested tmux rows and SSH transport"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
readme = "README.md"
license = { file = "LICENSE" }

[project.scripts]
nested-tmux = "nested_tmux.cli:main"

[tool.setuptools.packages.find]
include = ["nested_tmux*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
